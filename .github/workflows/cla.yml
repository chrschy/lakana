# Enabled from the moment the repository is public, when outside contributors can open pull
# requests.
#
# Signatures are stored in a separate private repository, chrschy/lakana-cla-signatures, so
# that they do not become public with this one. The token CLA_SIGNATURES_TOKEN (a fine-grained
# personal access token that can write the contents of that repository only) is an Actions
# secret of this repository.
#
# The path carries the agreement's version: when the agreement changes, change `v3` below
# together with CLA.md, so that a signature is never read as agreeing to a newer text.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# Read-only at the top: the one job below asks for what it writes.
permissions:
  contents: read

jobs:
  cla:
    permissions:
      actions: write           # re-run the check after a signature
      contents: read
      pull-requests: write     # the comment that asks for a signature
      statuses: write          # the commit status
    # A pull request starts the action; a comment starts it only on a pull request and only when
    # it is the signing phrase or `recheck`.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/v3/cla.json
          path-to-document: https://github.com/chrschy/lakana/blob/main/docs/legal/CLA.md
          remote-organization-name: chrschy
          remote-repository-name: lakana-cla-signatures
          branch: main
          allowlist: chrschy,dependabot[bot],github-actions[bot]
